<title>심유선 사육현황 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --page: #eeece1;
    --surface: #fbfaf5;
    --surface-2: #f3f1e6;
    --surface-inset: #e8e5d7;
    --ink: #1a1d16;
    --ink-soft: #4d5045;
    --muted: #83816f;
    --border: rgba(26,29,22,0.12);
    --border-strong: rgba(26,29,22,0.22);
    --accent: #2f4858;
    --accent-strong: #1c2f3a;
    --accent-soft: #dbe4e7;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(26,29,22,0.06), 0 8px 24px -12px rgba(26,29,22,0.18);

    --series-blue: #2a78d6;
    --series-blue-soft: #cde2fb;
    --good: #0ca30c;
    --good-soft: #dcf3dc;
    --warning: #b7790a;
    --warning-soft: #fbe8bf;
    --critical: #d03b3b;
    --critical-soft: #fadbdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #14161a;
      --surface: #1c1f22;
      --surface-2: #22262a;
      --surface-inset: #191c1f;
      --ink: #f1efe4;
      --ink-soft: #c7c4b3;
      --muted: #93968f;
      --border: rgba(241,239,228,0.12);
      --border-strong: rgba(241,239,228,0.22);
      --accent: #7fa8bb;
      --accent-strong: #a9c7d4;
      --accent-soft: #253840;
      --accent-ink: #10181b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);

      --series-blue: #3987e5;
      --series-blue-soft: #1c3350;
      --good: #2fbf3f;
      --good-soft: #163a1a;
      --warning: #e0ab2e;
      --warning-soft: #3d3110;
      --critical: #e66767;
      --critical-soft: #3d1c1c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #14161a;
    --surface: #1c1f22;
    --surface-2: #22262a;
    --surface-inset: #191c1f;
    --ink: #f1efe4;
    --ink-soft: #c7c4b3;
    --muted: #93968f;
    --border: rgba(241,239,228,0.12);
    --border-strong: rgba(241,239,228,0.22);
    --accent: #7fa8bb;
    --accent-strong: #a9c7d4;
    --accent-soft: #253840;
    --accent-ink: #10181b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);

    --series-blue: #3987e5;
    --series-blue-soft: #1c3350;
    --good: #2fbf3f;
    --good-soft: #163a1a;
    --warning: #e0ab2e;
    --warning-soft: #3d3110;
    --critical: #e66767;
    --critical-soft: #3d1c1c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  .dash { max-width: 1220px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- Header ---------- */
  .head {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 18px; margin-bottom: 22px;
    border-bottom: 2px solid var(--accent);
  }
  .head-eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 6px;
  }
  .head h1 {
    font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0;
    text-wrap: balance;
  }
  .head-meta { text-align: right; color: var(--muted); font-size: 12.5px; }
  .head-meta .range { color: var(--ink-soft); font-weight: 600; }

  /* ---------- KPI row ---------- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 14px 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: 0.01em; }
  .kpi-value { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .kpi-value .unit { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-left: 2px; }
  .kpi-sub { font-size: 11.5px; color: var(--muted); }
  .kpi-sub.status-good { color: var(--good); font-weight: 700; }
  .kpi-sub.status-warning { color: var(--warning); font-weight: 700; }
  .kpi-sub.status-critical { color: var(--critical); font-weight: 700; }

  /* ---------- Filters ---------- */
  .filters {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 20px;
  }
  .filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filter-label { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .chip {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--ink-soft); font-size: 12.5px; font-weight: 600; padding: 5px 11px;
    border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); color: var(--ink); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:focus-visible, .search-input:focus-visible, th button:focus-visible, .toggle-table:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .search-input {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    font-size: 12.5px; padding: 6px 10px; border-radius: 8px; font-family: inherit;
    min-width: 190px;
  }
  .filters-spacer { flex: 1; }
  .result-count { font-size: 12px; color: var(--muted); }

  /* ---------- Charts ---------- */
  .chart-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;
  }
  .chart-grid .wide { grid-column: 1 / -1; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px 14px; box-shadow: var(--shadow);
  }
  .card-title { font-size: 14px; font-weight: 800; margin: 0 0 2px; }
  .card-caption { font-size: 11.5px; color: var(--muted); margin: 0 0 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .toggle-table {
    background: none; border: none; color: var(--accent); font-size: 11.5px; font-weight: 700;
    cursor: pointer; padding: 2px 0; font-family: inherit; text-decoration: underline; text-underline-offset: 2px;
    white-space: nowrap;
  }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label {
    width: 108px; flex: 0 0 108px; font-size: 11.5px; color: var(--ink-soft);
    text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar-track { flex: 1; position: relative; height: 20px; background: var(--surface-inset); border-radius: 4px; overflow: visible; }
  .bar-fill {
    position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px;
    background: var(--series-blue); min-width: 3px;
  }
  .bar-fill.st-good { background: var(--good); }
  .bar-fill.st-warning { background: var(--warning); }
  .bar-fill.st-critical { background: var(--critical); }
  .bar-value {
    position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700;
    white-space: nowrap;
  }

  .vbar-chart { display: flex; align-items: flex-end; gap: 10px; height: 176px; padding-top: 20px; position: relative; }
  .vbar-chart .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); font-size: 10px; }
  .vbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; }
  .vbar-fill { width: 60%; max-width: 34px; background: var(--series-blue); border-radius: 4px 4px 0 0; position: relative; }
  .vbar-val { font-size: 10.5px; font-weight: 700; margin-bottom: 3px; white-space: nowrap; }
  .vbar-tick { font-size: 10.5px; color: var(--muted); margin-top: 6px; }

  .stack-bar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .stack-seg { height: 100%; position: relative; }
  .stack-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--accent-strong); color: var(--accent-ink);
    font-size: 11.5px; line-height: 1.5; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); max-width: 240px;
    opacity: 0; transform: translateY(2px); transition: opacity .1s ease, transform .1s ease;
  }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tooltip b { font-weight: 800; }
  .tooltip .t-row { display: flex; justify-content: space-between; gap: 10px; }

  .mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .mini-table th, .mini-table td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .mini-table th:first-child, .mini-table td:first-child { text-align: left; }

  /* ---------- Table ---------- */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .table-card-head { padding: 16px 18px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .table-scroll { overflow-x: auto; }
  table.ledger { width: 100%; border-collapse: collapse; min-width: 980px; }
  table.ledger thead th {
    position: sticky; top: 0; background: var(--surface-2); z-index: 1;
    text-align: right; font-size: 11px; font-weight: 700; color: var(--muted);
    padding: 9px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
  }
  table.ledger thead th:nth-child(1),
  table.ledger thead th:nth-child(2),
  table.ledger thead th:nth-child(3) { text-align: left; }
  table.ledger th button {
    background: none; border: none; font: inherit; color: inherit; cursor: pointer;
    padding: 0; display: inline-flex; align-items: center; gap: 3px;
  }
  table.ledger th .sort-arrow { font-size: 9px; opacity: 0.45; }
  table.ledger th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  table.ledger tbody td {
    padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px;
    text-align: right; white-space: nowrap;
  }
  table.ledger tbody td:nth-child(1),
  table.ledger tbody td:nth-child(2),
  table.ledger tbody td:nth-child(3) { text-align: left; }
  table.ledger tbody tr:hover td { background: var(--surface-2); }
  table.ledger tbody tr:nth-child(even) td { background: var(--surface-inset); }
  table.ledger tbody tr:nth-child(even):hover td { background: var(--surface-2); }
  .farm-cell { font-weight: 700; }
  .group-cell { color: var(--muted); font-size: 11.5px; }
  .cat-chip {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-strong);
  }
  .status-chip {
    display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12px;
    justify-content: flex-end;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status-dot.st-good { background: var(--good); }
  .status-dot.st-warning { background: var(--warning); }
  .status-dot.st-critical { background: var(--critical); }
  .status-chip.st-good { color: var(--good); }
  .status-chip.st-warning { color: var(--warning); }
  .status-chip.st-critical { color: var(--critical); }
  .empty-row td { text-align: center; color: var(--muted); padding: 28px; font-size: 13px; }

  .footer { margin-top: 22px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(3, 1fr); }
    .chart-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="dash">
  <div class="head">
    <div>
      <p class="head-eyebrow">양돈 사육 운영 현황</p>
      <h1>심유선 사육현황 대시보드</h1>
    </div>
    <div class="head-meta">
      <div>데이터 기준 <span class="range" id="dateRange">-</span></div>
      <div>총 <span class="range" id="farmCountMeta">-</span>개 농장 · <span class="range" id="groupCountMeta">-</span>개 배치</div>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">구분</span>
      <button class="chip active" data-filter="category" data-value="all">전체</button>
      <button class="chip" data-filter="category" data-value="비육돈">비육돈</button>
      <button class="chip" data-filter="category" data-value="자돈">자돈</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">육성률</span>
      <button class="chip active" data-filter="status" data-value="all">전체</button>
      <button class="chip" data-filter="status" data-value="good">양호 (≥96%)</button>
      <button class="chip" data-filter="status" data-value="warning">주의 (90–96%)</button>
      <button class="chip" data-filter="status" data-value="critical">위험 (&lt;90%)</button>
    </div>
    <input class="search-input" id="searchInput" type="text" placeholder="농장명 또는 그룹명 검색" />
    <div class="filters-spacer"></div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div class="chart-grid">
    <div class="card">
      <div class="card-head">
        <div>
          <p class="card-title">월별 입식두수 추이</p>
          <p class="card-caption">2026년 전입일 기준 합계</p>
        </div>
        <button class="toggle-table" data-target="monthChartTable">표로 보기</button>
      </div>
      <div id="monthChart"></div>
      <div id="monthChartTable" style="display:none"></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div>
          <p class="card-title">농장별 폐사현황</p>
          <p class="card-caption">폐사두수 상위 12개 농장 · 전입두수 대비 폐사율</p>
        </div>
        <button class="toggle-table" data-target="mortalityChartTable">표로 보기</button>
      </div>
      <div class="stack-legend" style="margin:0 0 10px;">
        <div class="legend-item"><span class="legend-swatch" style="background:var(--good)"></span>양호 &lt;4%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--warning)"></span>주의 4–7%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--critical)"></span>위험 ≥7%</div>
      </div>
      <div id="mortalityChart"></div>
      <div id="mortalityChartTable" style="display:none"></div>
    </div>
    <div class="card wide">
      <div class="card-head">
        <div>
          <p class="card-title">입식두수 결과 구성</p>
          <p class="card-caption">전체 입식두수 <span class="mono" id="totalEntryLabel">-</span>두의 현재 상태 비중</p>
        </div>
      </div>
      <div id="stackChart" style="margin-top:6px;"></div>
      <div class="stack-legend" id="stackLegend"></div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-card-head">
      <div>
        <p class="card-title" style="margin-bottom:0">배치별 상세 현황</p>
        <p class="card-caption" style="margin-bottom:0">그룹(배치) 단위 원장 · 헤더 클릭 시 정렬</p>
      </div>
    </div>
    <div class="table-scroll">
      <table class="ledger" id="ledgerTable">
        <thead>
          <tr>
            <th data-key="farm"><button>농장명 <span class="sort-arrow">▲</span></button></th>
            <th data-key="group"><button>그룹명 <span class="sort-arrow">▲</span></button></th>
            <th data-key="category"><button>구분 <span class="sort-arrow">▲</span></button></th>
            <th data-key="entryDate"><button>전입일 <span class="sort-arrow">▲</span></button></th>
            <th data-key="entryCount"><button>전입두수 <span class="sort-arrow">▲</span></button></th>
            <th data-key="currentAgeDays"><button>현재일령 <span class="sort-arrow">▲</span></button></th>
            <th data-key="deaths"><button>폐사두수 <span class="sort-arrow">▲</span></button></th>
            <th data-key="sold"><button>판매두수 <span class="sort-arrow">▲</span></button></th>
            <th data-key="currentStock"><button>현재고 <span class="sort-arrow">▲</span></button></th>
            <th data-key="survivalRate"><button>육성률 <span class="sort-arrow">▲</span></button></th>
          </tr>
        </thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    <span>출처: 업로드된 사육현황 원본 데이터 (85개 배치 · 30개 농장)</span>
    <span id="generatedAt"></span>
  </div>
</div>

const MONTHLY = [{"month": "2026-02", "entryCount": 450}, {"month": "2026-03", "entryCount": 2100}, {"month": "2026-04", "entryCount": 11030}, {"month": "2026-05", "entryCount": 7991}, {"month": "2026-06", "entryCount": 7652}, {"month": "2026-07", "entryCount": 10030}, {"month": "2026-08", "entryCount": 950}];

const fmt = n => n === null || n === undefined || Number.isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
const fmt1 = n => n === null || n === undefined || Number.isNaN(n) ? '-' : n.toFixed(1);
const monthLabel = m => (parseInt(m.slice(5,7),10)) + '월';

function statusOf(rate) {
  if (rate === null || rate === undefined || Number.isNaN(rate)) return null;
  if (rate >= 96) return 'good';
  if (rate >= 90) return 'warning';
  return 'critical';
}
const statusText = { good: '양호', warning: '주의', critical: '위험' };

// ---------------- Header meta ----------------
const dates = RECORDS.map(r => r.entryDate).sort();
document.getElementById('dateRange').textContent = dates[0] + ' ~ ' + dates[dates.length - 1];
document.getElementById('farmCountMeta').textContent = FARM_AGG.length;
document.getElementById('groupCountMeta').textContent = RECORDS.length;
document.getElementById('generatedAt').textContent = '생성: ' + new Date().toISOString().slice(0,10);

// ---------------- KPIs ----------------
const totalEntry = RECORDS.reduce((s, r) => s + r.entryCount, 0);
const totalStock = RECORDS.reduce((s, r) => s + r.currentStock, 0);
const totalDeaths = RECORDS.reduce((s, r) => s + r.deaths, 0);
const totalSold = RECORDS.reduce((s, r) => s + r.sold, 0);
const rated = RECORDS.filter(r => r.survivalRate !== null);
const weightedRate = rated.reduce((s, r) => s + r.survivalRate * r.entryCount, 0) / rated.reduce((s, r) => s + r.entryCount, 0);
const mortalityRate = totalDeaths / totalEntry * 100;
const stockShare = totalStock / totalEntry * 100;

const kpis = [
  { label: '사육 농장', value: FARM_AGG.length, unit: '개', sub: RECORDS.length + '개 배치 운영중' },
  { label: '누적 입식두수', value: fmt(totalEntry), unit: '두', sub: dates[0].slice(0,7) + ' ~ ' + dates[dates.length-1].slice(0,7) },
  { label: '현재 사육두수', value: fmt(totalStock), unit: '두', sub: '입식 대비 ' + fmt1(stockShare) + '%' },
  { label: '누적 폐사두수', value: fmt(totalDeaths), unit: '두', sub: '폐사율 ' + fmt1(mortalityRate) + '%', status: mortalityRate >= 6 ? 'critical' : (mortalityRate >= 4 ? 'warning' : 'good') },
  { label: '누적 출하두수', value: fmt(totalSold), unit: '두', sub: '입식 대비 ' + fmt1(totalSold/totalEntry*100) + '%' },
  { label: '가중평균 육성률', value: fmt1(weightedRate), unit: '%', sub: statusText[statusOf(weightedRate)], status: statusOf(weightedRate) },
];
document.getElementById('kpiRow').innerHTML = kpis.map(k => `
  <div class="kpi">
    <div class="kpi-label">${k.label}</div>
    <div class="kpi-value mono">${k.value}<span class="unit">${k.unit}</span></div>
    <div class="kpi-sub${k.status ? ' status-' + k.status : ''}">${k.sub}</div>
  </div>
`).join('');

document.getElementById('totalEntryLabel').textContent = fmt(totalEntry);

// ---------------- Tooltip ----------------
const tooltipEl = document.getElementById('tooltip');
function showTooltip(evt, html) {
  tooltipEl.innerHTML = html;
  tooltipEl.classList.add('show');
  positionTooltip(evt);
}
function positionTooltip(evt) {
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const rect = tooltipEl.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > window.innerHeight - 8) y = evt.clientY - rect.height - pad;
  tooltipEl.style.left = x + 'px';
  tooltipEl.style.top = y + 'px';
}
function hideTooltip() { tooltipEl.classList.remove('show'); }

// ---------------- Farm mortality bar chart ----------------
function mortalityStatus(rate) {
  if (rate < 4) return 'good';
  if (rate < 7) return 'warning';
  return 'critical';
}

function renderMortalityChart() {
  const withRate = FARM_AGG.map(f => ({ ...f, mortalityRate: f.deaths / f.entryCount * 100 }));
  const top = withRate.slice().sort((a, b) => b.deaths - a.deaths).slice(0, 12);
  const max = Math.max(...top.map(f => f.deaths));
  const el = document.getElementById('mortalityChart');
  el.innerHTML = top.map(f => {
    const pct = Math.max(f.deaths / max * 100, 1.5);
    const st = mortalityStatus(f.mortalityRate);
    return `<div class="bar-row" data-farm="${f.farm}">
      <div class="bar-label" title="${f.farm}">${f.farm}</div>
      <div class="bar-track">
        <div class="bar-fill st-${st}" style="width:${pct}%"></div>
        <div class="bar-value" style="left:calc(${pct}% + 6px); color:var(--ink)">${fmt(f.deaths)}두 (${fmt1(f.mortalityRate)}%)</div>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.bar-row').forEach(row => {
    const f = top.find(x => x.farm === row.dataset.farm);
    row.addEventListener('mousemove', e => showTooltip(e, `
      <div><b>${f.farm}</b></div>
      <div class="t-row"><span>배치 수</span><span>${f.groups}개</span></div>
      <div class="t-row"><span>전입두수</span><span>${fmt(f.entryCount)}두</span></div>
      <div class="t-row"><span>폐사두수</span><span>${fmt(f.deaths)}두</span></div>
      <div class="t-row"><span>폐사율</span><span>${fmt1(f.mortalityRate)}%</span></div>
      <div class="t-row"><span>현재고</span><span>${fmt(f.currentStock)}두</span></div>
    `));
    row.addEventListener('mouseleave', hideTooltip);
  });

  document.getElementById('mortalityChartTable').innerHTML = `
    <table class="mini-table"><thead><tr><th>농장명</th><th>폐사두수</th><th>폐사율</th></tr></thead>
    <tbody>${top.map(f => `<tr><td>${f.farm}</td><td class="mono">${fmt(f.deaths)}두</td><td class="mono">${fmt1(f.mortalityRate)}%</td></tr>`).join('')}</tbody></table>`;
}

// ---------------- Monthly vertical bar chart ----------------
function renderMonthChart() {
  const max = Math.max(...MONTHLY.map(m => m.entryCount));
  const el = document.getElementById('monthChart');
  el.innerHTML = `<div class="vbar-chart">` + MONTHLY.map(m => {
    const pct = Math.max(m.entryCount / max * 100, 2);
    return `<div class="vbar-col" data-month="${m.month}">
      <div class="vbar-val mono">${fmt(m.entryCount)}</div>
      <div class="vbar-fill" style="height:${pct}%"></div>
      <div class="vbar-tick">${monthLabel(m.month)}</div>
    </div>`;
  }).join('') + `</div>`;

  el.querySelectorAll('.vbar-col').forEach(col => {
    const m = MONTHLY.find(x => x.month === col.dataset.month);
    col.addEventListener('mousemove', e => showTooltip(e, `
      <div><b>${m.month}</b></div>
      <div class="t-row"><span>입식두수</span><span>${fmt(m.entryCount)}두</span></div>
    `));
    col.addEventListener('mouseleave', hideTooltip);
  });

  document.getElementById('monthChartTable').innerHTML = `
    <table class="mini-table"><thead><tr><th>월</th><th>입식두수</th></tr></thead>
    <tbody>${MONTHLY.map(m => `<tr><td>${m.month}</td><td class="mono">${fmt(m.entryCount)}두</td></tr>`).join('')}</tbody></table>`;
}

// ---------------- Outcome stacked bar ----------------
function renderStackChart() {
  const deaths = totalDeaths, sold = totalSold, stock = totalStock;
  const total = deaths + sold + stock;
  const segs = [
    { key: 'stock', label: '현재 사육중', value: stock, color: 'var(--series-blue)' },
    { key: 'sold', label: '출하(판매)', value: sold, color: 'var(--good)' },
    { key: 'deaths', label: '폐사', value: deaths, color: 'var(--critical)' },
  ];
  const el = document.getElementById('stackChart');
  el.innerHTML = `<div class="stack-bar">` + segs.map(s => {
    const pct = s.value / total * 100;
    return `<div class="stack-seg" data-key="${s.key}" style="width:${pct}%; background:${s.color}"></div>`;
  }).join('<div style="width:2px;background:var(--surface)"></div>') + `</div>`;

  el.querySelectorAll('.stack-seg').forEach(seg => {
    const s = segs.find(x => x.key === seg.dataset.key);
    const pct = s.value / total * 100;
    seg.addEventListener('mousemove', e => showTooltip(e, `
      <div><b>${s.label}</b></div>
      <div class="t-row"><span>두수</span><span>${fmt(s.value)}두</span></div>
      <div class="t-row"><span>비중</span><span>${fmt1(pct)}%</span></div>
    `));
    seg.addEventListener('mouseleave', hideTooltip);
  });

  document.getElementById('stackLegend').innerHTML = segs.map(s => `
    <div class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${s.label} · ${fmt(s.value)}두 (${fmt1(s.value/total*100)}%)</div>
  `).join('');
}

// ---------------- Filters + Table ----------------
const state = { category: 'all', status: 'all', search: '', sortKey: 'entryDate', sortDir: 'desc' };

function applyFilters() {
  return RECORDS.filter(r => {
    if (state.category !== 'all' && r.category !== state.category) return false;
    if (state.status !== 'all' && statusOf(r.survivalRate) !== state.status) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!r.farm.toLowerCase().includes(q) && !r.group.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  let rows = applyFilters();
  const { sortKey, sortDir } = state;
  rows = rows.slice().sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) av = sortDir === 'asc' ? Infinity : -Infinity;
    if (bv === null || bv === undefined) bv = sortDir === 'asc' ? Infinity : -Infinity;
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  const body = document.getElementById('ledgerBody');
  if (rows.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="10">조건에 맞는 배치가 없습니다.</td></tr>`;
  } else {
    body.innerHTML = rows.map(r => {
      const st = statusOf(r.survivalRate);
      return `<tr>
        <td class="farm-cell">${r.farm}</td>
        <td class="group-cell mono">${r.group}</td>
        <td><span class="cat-chip">${r.category}</span></td>
        <td class="mono">${r.entryDate}</td>
        <td class="mono">${fmt(r.entryCount)}</td>
        <td class="mono">${r.currentAgeDays !== null ? fmt(r.currentAgeDays) : '-'}</td>
        <td class="mono">${fmt(r.deaths)}</td>
        <td class="mono">${fmt(r.sold)}</td>
        <td class="mono">${fmt(r.currentStock)}</td>
        <td>${st ? `<span class="status-chip st-${st}"><span class="status-dot st-${st}"></span>${fmt1(r.survivalRate)}%</span>` : '-'}</td>
      </tr>`;
    }).join('');
  }
  document.getElementById('resultCount').textContent = `${rows.length} / ${RECORDS.length}개 배치 표시중`;

  document.querySelectorAll('#ledgerTable thead th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    const arrow = th.querySelector('.sort-arrow');
    if (th.dataset.key === sortKey) arrow.textContent = sortDir === 'asc' ? '▲' : '▼';
  });
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const { filter, value } = chip.dataset;
    state[filter] = value;
    document.querySelectorAll(`.chip[data-filter="${filter}"]`).forEach(c => c.classList.toggle('active', c === chip));
    renderTable();
  });
});
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderTable();
});
document.querySelectorAll('#ledgerTable thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = key; state.sortDir = 'desc'; }
    renderTable();
  });
});
document.querySelectorAll('.toggle-table').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = document.getElementById(btn.dataset.target);
    const chartId = btn.dataset.target.replace('Table', '');
    const chart = document.getElementById(chartId);
    const show = target.style.display === 'none';
    target.style.display = show ? 'block' : 'none';
    chart.style.display = show ? 'none' : 'block';
    btn.textContent = show ? '차트로 보기' : '표로 보기';
  });
});

renderMortalityChart();
renderMonthChart();
renderStackChart();
renderTable();
</script>
